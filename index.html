function handleManualKeyDown(e) {
    const isHotkey = (e.key === 'PageUp' || e.key === 'PgUp' || e.keyCode === 33 ||
                      e.key === 'PageDown' || e.key === 'PgDn' || e.keyCode === 34 ||
                      e.key === 'Enter' || e.keyCode === 13);
    
    if (isHotkey) {
        showLog(`[키 감지] Key: ${e.key}, Code: ${e.keyCode}`, 'info');
    }

    const tag = document.activeElement?.tagName.toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;

    if (e.key === 'Enter' || e.keyCode === 13) {
        e.preventDefault();
        if (isIndividualManualMode) {
            handleIndividualManualSave();
        } else {
            handleManualSave();
        }
    } else if (e.key === 'PageUp' || e.key === 'PgUp' || e.keyCode === 33) {
        e.preventDefault();
        handleManualPrev();
    } else if (e.key === 'PageDown' || e.key === 'PgDn' || e.keyCode === 34) {
        e.preventDefault();
        handleManualNext();
    }
}

let currentPreviewAddrCoords = null;

async function loadManualAddress(idx) {
    if (idx < 0 || idx >= individualAddressQueue.length) return;
    const mySessionId = ++activeLoadSessionId;
    curIdx = idx;
    const item = individualAddressQueue[idx];
    const bKey = item.bKey;
    const addr = item.addr;
    
    const idx_sep = bKey.indexOf('_');
    const bNo = idx_sep !== -1 ? bKey.substring(idx_sep + 1) : bKey;
    currentPreviewAddr = addr;
    
    document.getElementById('manual-bno').textContent = `건물번호: ${bNo} (${idx + 1}/${individualAddressQueue.length})`;
    
    // 순번 입력 창 동기화
    const inputJump = document.getElementById('input-manual-jump');
    if (inputJump) {
        inputJump.value = idx + 1;
    }
    
    document.getElementById('manual-addr').textContent = addr;
    
    document.getElementById('sb-bno').textContent = bNo;
    document.getElementById('sb-addr').textContent = addr;
    
    clearOverlays();
    cachedGeometries = [];
    
    let hasGeom = false;
    let groupCoords = [];
    
    // Auto load regional offset
    let matchedOffset = null;
    if (addressOffsets[addr]) {
        matchedOffset = { x: addressOffsets[addr].x, y: addressOffsets[addr].y };
    }
    if (!matchedOffset) {
        try {
            const tempCoords = await geocodeAddress(addr);
            const closest = findClosestCalibratedOffset(tempCoords.lon, tempCoords.lat);
            if (closest) {
                matchedOffset = closest.offset;
            }
        } catch(e) {}
    }
    if (!matchedOffset) {
        const region = getRegionPrefix(addr);
        const regOffsets = getRegionalOffsets();
        if (regOffsets[region]) {
            matchedOffset = { x: regOffsets[region].x, y: regOffsets[region].y };
        }
    }
    if (!matchedOffset) {
        matchedOffset = { x: 0, y: 14 };
    }
    
    offsetX = matchedOffset.x;
    offsetY = matchedOffset.y;
    
    try {
        const coords = await geocodeAddress(addr);
        if (mySessionId !== activeLoadSessionId) return;
        currentPreviewAddrCoords = coords;
        const features = await getParcelBoundary(coords.lon, coords.lat, coords._features, coords._fallbackAddr || addr);
        if (mySessionId !== activeLoadSessionId) return;
        const metadata = calculateParcelMetadata(features, { lon: coords.lon, lat: coords.lat });
        saveParcelCache(addr, metadata);
        groupCoords.push({ addr, lon: coords.lon, lat: coords.lat, area: metadata.area || 0 });
        (features || []).forEach(f => {
            if (f.geometry) {
                cachedGeometries.push(f.geometry);
                hasGeom = true;
            }
        });
    } catch(e) {
        showLog(`오류 (${addr}): ${e.message}`, 'warn');
    }
    
    if (mySessionId !== activeLoadSessionId) return;
    
    document.getElementById('manual-calibration-panel')._groupCoords = groupCoords;
    document.getElementById('off-x').value = offsetX;
    document.getElementById('off-y').value = offsetY;
    updateManualOffsetsDisplay();
    
    updateRegionDisplay();
    redrawCached();
    
    if (mySessionId !== activeLoadSessionId) return;

    // Set map label
    const basePrefix = bKey;
    const labelEl = document.getElementById('map-label');
    const labelLines = splitAddress(addr);
    labelEl.style.display = 'block';
    labelEl.innerHTML = `
        <div style="font-size: 14px; color: var(--accent); margin-bottom: 4px;">${basePrefix}</div>
        <div style="font-size: 13px; color: var(--txt2); margin-bottom: 4px;">${labelLines[0]}</div>
        <div style="font-size: 16px; font-weight: bold; color: #ffffff;">${labelLines[1]}</div>
    `;

    if (cachedGeometries.length > 0) {
        await centerOnGeometriesAndWait(individualZoom);
    } else if (groupCoords.length > 0) {
        const center = new naver.maps.LatLng(
            groupCoords[0].lat + offsetY * 0.00001,
            groupCoords[0].lon + offsetX * 0.00001
        );
        naverMap.setCenter(center);
        naverMap.setZoom(individualZoom);
    }
}

async function startManualIndividualCalibration() {
    isIndividualManualMode = true;

    // Build individual address queue (Include all address groups)
    individualAddressQueue = [];
    buildingQueue.forEach((bKey) => {
        const addrs = buildingGroups[bKey] || [];
        addrs.forEach((addr) => {
            individualAddressQueue.push({ bKey: bKey, addr: addr });
        });
    });
    
    const urlParams = new URLSearchParams(window.location.search);
    const startIdx = parseInt(urlParams.get('startIdx') || '0') || 0;
    curManualIdx = startIdx;
    
    const panel = document.getElementById('manual-calibration-panel');
    if (panel) panel.style.display = 'flex';

    document.getElementById('btn-manual-save').onclick = handleIndividualManualSave;

    if (btnPrev) btnPrev.onclick = handleManualPrev;
    const btnNext = document.getElementById('btn-manual-next');
    if (btnNext) btnNext.onclick = handleManualNext;
    
    const btnBatch = document.getElementById('btn-manual-batch');
    if (btnBatch) btnBatch.onclick = toggleIndividualManualBatch;
    
    // Bind jump input
    const inputJump = document.getElementById('input-manual-jump');
    if (inputJump) {
        inputJump.onchange = async () => {
            const val = parseInt(inputJump.value) || 1;
            const targetIdx = Math.max(0, Math.min(individualAddressQueue.length - 1, val - 1));
            curManualIdx = targetIdx;
            await loadManualAddress(curManualIdx);
        };
        inputJump.onkeydown = async (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                inputJump.blur();
            }
        };
    }
    
    window.addEventListener('keydown', handleManualKeyDown, true);
    await loadManualAddress(curManualIdx);
}

async function previewBuilding(bKey) {
    const mySessionId = ++activeLoadSessionId;
    clearOverlays();
    const addrs = buildingGroups[bKey] || [];
    const firstAddr = addrs[0] || '';
    currentPreviewAddr = firstAddr;

    // Extract bNo and usage from bKey
    const idx = bKey.indexOf('_');
    const usage = idx !== -1 ? bKey.substring(0, idx) : '';
    const bNo = idx !== -1 ? bKey.substring(idx + 1) : bKey;

    // Auto load regional offset for preview
    if (firstAddr) {
        const region = getRegionPrefix(firstAddr);
        const regOffsets = getRegionalOffsets();
        if (regOffsets[region]) {
            offsetX = regOffsets[region].x;
            offsetY = regOffsets[region].y;
            document.getElementById('off-x').value = offsetX;
            document.getElementById('off-y').value = offsetY;
            showLog(`[${region}] 지역 보정값 자동 적용: X=${offsetX}, Y=${offsetY}`, 'info');
        }
        updateRegionDisplay();
    }

    document.getElementById('sb-bno').textContent  = bNo;
    showLog(`미리보기: ${bKey}`, 'info');
    
    const basePrefix = bKey;
    const labelEl = document.getElementById('map-label');
    
    const labelLines = firstAddr ? splitAddress(firstAddr) : ['', ''];
    labelEl.style.display = 'block';
    labelEl.innerHTML = `
        <div style="font-size: 14px; color: var(--accent); margin-bottom: 4px;">${basePrefix}</div>
        <div style="font-size: 13px; color: var(--txt2); margin-bottom: 4px;">${labelLines[0]}</div>
        <div style="font-size: 16px; font-weight: bold; color: #ffffff;">${labelLines[1]} (${addrs.length}개 필지)</div>
    `;

    for (const addr of addrs) {
        document.getElementById('sb-addr').textContent = addr;
        try {
            const c = await geocodeAddress(addr);
            if (mySessionId !== activeLoadSessionId) return;
            const f = await getParcelBoundary(c.lon, c.lat, c._features, c._fallbackAddr || addr);
            if (mySessionId !== activeLoadSessionId) return;
            (f||[]).forEach(ft => {
                if (ft.geometry) { drawGeometry(ft.geometry); }
            });
        } catch(e) { showLog(`미리보기 오류: ${e.message}`, 'warn'); }
        await sleep(200);
        if (mySessionId !== activeLoadSessionId) return;
    }

    if (cachedGeometries.length > 0) { 
        if (mySessionId !== activeLoadSessionId) return;
        fitBounds(); 
        showLog('미리보기 완료', 'success'); 
    }
    else showLog('경계 데이터 없음', 'error');
}

function getBuildingPrefix(filename) {
    const name = filename.substring(0, filename.length - 4);
    
    // Pattern 1: {usage}_{number} at the start (e.g. 공장_1_대구...)
    const matchUsageNum = name.match(/^([a-zA-Z0-9가-힣]+)_([0-9]+)(_|$)/);
    if (matchUsageNum) {
        return `${matchUsageNum[1]}_${matchUsageNum[2]}`;
    }
    
    // Pattern 2: just a number at the start (e.g. 1_대구...)
    const matchNum = name.match(/^([0-9]+)(_|$)/);
    if (matchNum) {
        return matchNum[1];
    }
    
    const parts = name.split('_');
    return parts[0];
}

async function convertImagesToPDF() {
    if (!dirHandle) {
        alert('지도가 저장된 폴더를 먼저 선택해 주세요.');
        await selectFolder();
        if (!dirHandle) return;
    } else {
        const perm = await verifyPermission(dirHandle, true);
        if (!perm) {
            alert('지도를 읽고 PDF로 저장하기 위해 폴더 권한 승인이 필요합니다.');
            return;
        }
    }

    const ov = document.getElementById('cap-ov');
    const capT = document.getElementById('cap-t');
    const capS = document.getElementById('cap-s');
    
    if (ov) {
        capT.textContent = 'PDF 변환 중...';
        capS.textContent = '폴더 스캔 중';
        ov.classList.add('on');
    }
    await sleep(100);

    try {
        // 1. Scan directory for all PNG files
        const files = [];
        for await (const entry of dirHandle.values()) {
            if (entry.kind === 'file' && entry.name.endsWith('.png')) {
                files.push(entry);
            }
        }

        showLog(`폴더 스캔 완료: PNG 파일 ${files.length}개 발견`, 'info');

        // 2. Group files by prefix
        const groups = {};
        for (const f of files) {
            const prefix = getBuildingPrefix(f.name);
            if (!groups[prefix]) {
                groups[prefix] = {
                    combined: null,
                    individuals: []
                };
            }
            if (f.name === `${prefix}.png`) {
                groups[prefix].combined = f;
            } else {
                groups[prefix].individuals.push(f);
            }
        }

        // 3. Sort prefixes naturally (e.g. 공장_1, 공장_2, 공장_10)
        const prefixes = Object.keys(groups).sort((a, b) => {
            const parseKey = (key) => {
                const idx = key.indexOf('_');
                if (idx !== -1) {
                    const usage = key.substring(0, idx);
                    const num = parseInt(key.substring(idx + 1)) || 0;
                    return { usage, num };
                } else {
                    return { usage: '', num: parseInt(key) || 0 };
                }
            };
            const pa = parseKey(a);
            const pb = parseKey(b);
            if (pa.usage !== pb.usage) return pa.usage.localeCompare(pb.usage);
            return pa.num - pb.num;
        });

        let pdfCount = 0;

        // 4. Process each building group
        for (let i = 0; i < prefixes.length; i++) {
            const basePrefix = prefixes[i];
            const group = groups[basePrefix];

            if (ov) {
                capS.textContent = `${basePrefix} 변환 중 (${i + 1}/${prefixes.length})`;
            }
            await sleep(50);

            // Geocode and calculate parcel areas & centroids for individual maps
            const polygonData = [];
            for (const fh of group.individuals) {
                const cleanPart = fh.name.substring(basePrefix.length + 1, fh.name.length - 4);
                const approxAddr = cleanPart.replace(/_/g, ' ');
                
                const cached = getParcelCache()[approxAddr];
                if (cached) {
                    polygonData.push({
                        fileHandle: fh,
                        address: approxAddr,
                        area: cached.area,
                        centroid: cached.centroid
                    });
                    continue;
                }

                try {
                    const coords = await geocodeAddress(approxAddr);
                    const features = await getParcelBoundary(coords.lon, coords.lat, coords._features, coords._fallbackAddr || approxAddr);
                    const metadata = calculateParcelMetadata(features, { lon: coords.lon, lat: coords.lat });
                    saveParcelCache(approxAddr, metadata);

                    polygonData.push({
                        fileHandle: fh,
                        address: approxAddr,
                        area: metadata.area,
                        centroid: metadata.centroid
                    });
                } catch(e) {
                    // Fail gracefully
                    polygonData.push({
                        fileHandle: fh,
                        address: approxAddr,
                        area: 0,
                        centroid: { lon: 128.61065, lat: 35.91317 }
                    });
                }
            }

            // Sort logic:
            // 1. Find item with largest area
            let largestItem = null;
            const validGeo = polygonData.filter(item => item.area > 0);
            if (validGeo.length > 0) {
                largestItem = validGeo.reduce((max, item) => item.area > max.area ? item : max, validGeo[0]);
            }

            // 2. Compute average centroid of all parcels with valid coordinates
            let sumLon = 0, sumLat = 0, validGeoCount = 0;
            polygonData.forEach(item => {
                if (item.area > 0) {
                    sumLon += item.centroid.lon;
                    sumLat += item.centroid.lat;
                    validGeoCount++;
                }
            });
            const centerCentroid = validGeoCount > 0 
                ? { lon: sumLon / validGeoCount, lat: sumLat / validGeoCount } 
                : { lon: 128.61065, lat: 35.91317 };

            // 3. Sort remaining items clockwise around center centroid
            const remainingItems = polygonData.filter(item => item !== largestItem);
            remainingItems.sort((a, b) => {
                if (a.area > 0 && b.area > 0) {
                    const angleA = Math.atan2(a.centroid.lat - centerCentroid.lat, a.centroid.lon - centerCentroid.lon);
                    const angleB = Math.atan2(b.centroid.lat - centerCentroid.lat, b.centroid.lon - centerCentroid.lon);
                    return angleB - angleA; // clockwise sorting
                } else {
                    return a.address.localeCompare(b.address);
                }
            });

            // 4. Combine into final sorted list (Skip individual map if it is identical to the combined map)
            const finalFiles = [];
            if (group.combined) {
                finalFiles.push(group.combined);
            }
            if (group.combined && group.individuals.length === 1) {
                // Skip the single individual map since it is identical to the combined map
            } else {
                if (largestItem) {
                    finalFiles.push(largestItem.fileHandle);
                }
                remainingItems.forEach(item => {
                    finalFiles.push(item.fileHandle);
                });
            }

            // 5. Load images
            const imgs = [];
            for (const fh of finalFiles) {
                try {
                    const img = await loadImageFromFileHandle(fh);
                    imgs.push(img);
                } catch(err) {
                    showLog(err.message, 'error');
                }
            }

            if (imgs.length === 0) continue;

            const maxH = Math.max(...imgs.map(img => img.height));
            const gapHeight = Math.round(maxH * 0.07) || 80;

            // 6. Group images into pages (max 6,000 pixels total height per page or max 3 images per page)
            const pages = [];
            let currentPageImgs = [];
            let currentPageH = 0;
            const maxPageHeight = 6000;
            const maxImagesPerPage = 3;
            
            for (const img of imgs) {
                const neededH = img.height + (currentPageImgs.length > 0 ? gapHeight : 0);
                const countExceeded = currentPageImgs.length >= maxImagesPerPage;
                const heightExceeded = (currentPageH + neededH) > maxPageHeight;
                
                if (currentPageImgs.length > 0 && (countExceeded || heightExceeded)) {
                    pages.push(currentPageImgs);
                    currentPageImgs = [img];
                    currentPageH = img.height;
                } else {
                    currentPageImgs.push(img);
                    currentPageH += neededH;
                }
            }
            if (currentPageImgs.length > 0) {
                pages.push(currentPageImgs);
            }

            // 7. Generate PDF by rendering each page
            const { jsPDF } = window.jspdf;
            let pdf = null;
            
            for (let pageIdx = 0; pageIdx < pages.length; pageIdx++) {
                const pageImgs = pages[pageIdx];
                const canvas = document.createElement('canvas');
                const maxW = Math.max(...pageImgs.map(img => img.width));
                const totalH = pageImgs.reduce((sum, img) => sum + img.height, 0) + pageImgs.length * gapHeight;
                
                canvas.width = maxW;
                canvas.height = totalH;
                
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                let currentY = Math.round(gapHeight / 2);
                for (let idx = 0; idx < pageImgs.length; idx++) {
                    const img = pageImgs[idx];
                    const xOffset = Math.max(0, Math.round((maxW - img.width) / 2));
                    ctx.drawImage(img, xOffset, currentY);
                    currentY += img.height + gapHeight;
                }
                
                const orientation = canvas.width > canvas.height ? 'l' : 'p';
                
                if (pageIdx === 0) {
                    pdf = new jsPDF({
                        orientation: orientation,
                        unit: 'px',
                        format: [canvas.width, canvas.height]
                    });
                } else {
                    pdf.addPage([canvas.width, canvas.height], orientation);
                }
                
                pdf.addImage(canvas.toDataURL('image/jpeg', 0.8), 'JPEG', 0, 0, canvas.width, canvas.height);
            }

            if (!pdf) continue;

            const pdfFilename = `${basePrefix}.pdf`;
            let savedDirectly = false;

            if (dirHandle) {
                try {
                    const pdfBlob = pdf.output('blob');
                    const pdfFileHandle = await dirHandle.getFileHandle(pdfFilename, { create: true });
                    const writable = await pdfFileHandle.createWritable();
                    await writable.write(pdfBlob);
                    await writable.close();
                    savedDirectly = true;
                } catch(err) {
                    showLog(`PDF 저장 중 직접 쓰기 오류: ${err.message}`, 'error');
                }
            }

            if (!savedDirectly) {
                pdf.save(pdfFilename);
            }

            showLog(`✓ PDF 변환 완료: ${pdfFilename} (${pages.length}페이지)`, 'success');
            pdfCount++;
        }

        alert(`PDF 변환 완료!\n총 ${pdfCount}개의 PDF 파일이 생성되었습니다.`);

    } catch(e) {
        showLog(`PDF 변환 오류: ${e.message}`, 'error');
        alert(`PDF 변환 중 오류가 발생했습니다: ${e.message}`);
    } finally {
        if (ov) {
            ov.classList.remove('on');
        }
    }
}

async function loadImageFromFileHandle(fileHandle) {
    const file = await fileHandle.getFile();
    const url = URL.createObjectURL(file);
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            URL.revokeObjectURL(url);
            resolve(img);
        };
        img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error(`이미지 로드 실패: ${fileHandle.name}`));
        };
        img.src = url;
    });
}

document.addEventListener('keydown', e => {
    const tag = document.activeElement?.tagName.toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
    let changed = false;
    switch(e.key) {
        case 'ArrowUp':    offsetY += 1; changed = true; break;
        case 'ArrowDown':  offsetY -= 1; changed = true; break;
        case 'ArrowRight': offsetX += 1; changed = true; break;
        case 'ArrowLeft':  offsetX -= 1; changed = true; break;
    }
    if (changed) {
        e.preventDefault();
        document.getElementById('off-x').value = offsetX;
        document.getElementById('off-y').value = offsetY;
        localStorage.setItem('mapOffsetX', offsetX);
        localStorage.setItem('mapOffsetY', offsetY);
        if (currentPreviewAddr) {
            const region = getRegionPrefix(currentPreviewAddr);
            saveRegionalOffset(region, offsetX, offsetY);
        }
        if (cachedGeometries.length) redrawCached();
        updateManualOffsetsDisplay();
    }
});

    async function mergePDFsByUsage() {
        if (!dirHandle) {
            alert('지도가 저장된 폴더를 먼저 선택해 주세요.');
            await selectFolder();
            if (!dirHandle) return;

            if (!perm) {
                alert('지도를 읽고 PDF를 통합하기 위해 폴더 권한 승인이 필요합니다.');
                return;
            }

        const capT = document.getElementById('cap-t');
        const capS = document.getElementById('cap-s');
        
        if (ov) {
            capT.textContent = 'PDF 통합 중...';
            capS.textContent = '폴더 스캔 중';
            ov.classList.add('on');
        }
        await sleep(100);

        try {
            // 1. Scan directory for all PDF files (excluding *_통합.pdf)
            const pdfFiles = [];
            for await (const entry of dirHandle.values()) {
                if (entry.kind === 'file' && entry.name.endsWith('.pdf') && !entry.name.endsWith('_통합.pdf')) {
                    pdfFiles.push(entry);
                }
            }

            if (pdfFiles.length === 0) {
                alert('폴더 내에 통합할 PDF 파일이 없습니다.');
                return;
            }

            showLog(`PDF 스캔 완료: PDF 파일 ${pdfFiles.length}개 발견`, 'info');

            // 2. Group PDF files by building usage
            const groups = {};
            for (const f of pdfFiles) {
                const name = f.name.substring(0, f.name.length - 4); // remove .pdf
                const idx = name.indexOf('_');
                const usage = idx !== -1 ? name.substring(0, idx) : '';
                
                if (!groups[usage]) {
                    groups[usage] = [];
                }
                groups[usage].push(f);
            }

            const usages = Object.keys(groups).sort();
            const mergedList = [];

            // 3. Process each usage group
            for (let i = 0; i < usages.length; i++) {
                const usage = usages[i];
                const groupFiles = groups[usage];

                if (ov) {
                    capS.textContent = `${usage || '기타'} PDF 통합 중 (${i + 1}/${usages.length})`;
                }
                await sleep(50);

                // Sort files numerically by building number
                groupFiles.sort((a, b) => {
                    const getNum = (name) => {
                        const cleanName = name.substring(0, name.length - 4);
                        const idx = cleanName.indexOf('_');
                        if (idx !== -1) {
                            return parseInt(cleanName.substring(idx + 1)) || 0;
                        }
                        return parseInt(cleanName) || 0;
                    };
                    return getNum(a.name) - getNum(b.name);
                });

                // Merge using pdf-lib
                const { PDFDocument } = PDFLib;
                const mergedPdf = await PDFDocument.create();
                
                let loadedCount = 0;
                for (const fh of groupFiles) {
                    try {
                        const file = await fh.getFile();
                        const arrayBuffer = await file.arrayBuffer();
                        const pdfDoc = await PDFDocument.load(arrayBuffer);
                        const copiedPages = await mergedPdf.copyPages(pdfDoc, pdfDoc.getPageIndices());
                        copiedPages.forEach((page) => mergedPdf.addPage(page));
                        loadedCount++;
                    } catch (err) {
                        showLog(`PDF 로드 실패 (${fh.name}): ${err.message}`, 'error');
                    }
                }

                if (loadedCount === 0) continue;

                const mergedPdfBytes = await mergedPdf.save();
                const pdfBlob = new Blob([mergedPdfBytes], { type: 'application/pdf' });

                const outputName = usage ? `${usage}_통합.pdf` : `기타_통합.pdf`;
                
                let savedDirectly = false;
                if (dirHandle) {
                    try {
                        const pdfFileHandle = await dirHandle.getFileHandle(outputName, { create: true });
                        const writable = await pdfFileHandle.createWritable();
                        await writable.write(pdfBlob);
                        await writable.close();
                        savedDirectly = true;
                    } catch(err) {
                        showLog(`PDF 통합본 저장 중 직접 쓰기 오류: ${err.message}`, 'error');
                    }
                }

                if (!savedDirectly) {
                    // Fallback: browser download
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(pdfBlob);
                    link.download = outputName;
                    link.click();
                }

                showLog(`✓ PDF 통합 완료: ${outputName} (${groupFiles.length}개 파일 병합)`, 'success');
                mergedList.push(outputName);
            }

            alert(`PDF 통합이 완료되었습니다!\n생성된 파일:\n${mergedList.join('\n')}`);

        } catch(e) {
            showLog(`PDF 통합 오류: ${e.message}`, 'error');
            alert(`PDF 통합 중 오류가 발생했습니다: ${e.message}`);
        } finally {
            if (ov) {
                ov.classList.remove('on');
            }
        }
    }

    document.getElementById('off-x').value = offsetX;
    document.getElementById('off-y').value = offsetY;
    document.getElementById('stroke-weight').value = strokeWeight;

    // Load save folder path from IndexedDB
    try {
        const storedHandle = await getDBValue('dirHandle');
        if (storedHandle) {
            dirHandle = storedHandle;
            let pathStr = localStorage.getItem('saveFolderDisplay');
            if (pathStr && pathStr.includes('dudo0')) {
                pathStr = null;
                localStorage.removeItem('saveFolderDisplay');
            }
            if (!pathStr) {
                pathStr = `C:\\Users\\User\\Downloads\\${dirHandle.name}`; // Fallback
                try {
                    const resp = await fetch(`/api/downloads-path?folder=${encodeURIComponent(dirHandle.name)}`);
                    if (resp.ok) {
                        const json = await resp.json();
                        if (json.path) pathStr = json.path;
                    }
                } catch(e) {}
                localStorage.setItem('saveFolderDisplay', pathStr);
            }
            const pEl = document.getElementById('save-folder-path');
            if (pEl) pEl.value = pathStr;
        } else {
            const pEl = document.getElementById('save-folder-path');
            if (pEl) pEl.value = '저장 경로를 설정해 주세요';
        }
    } catch(e) {
        const pEl = document.getElementById('save-folder-path');
        if (pEl) pEl.value = '저장 경로를 설정해 주세요';
    }

    showLog('지적도 자동 경계 캡처 도구 준비됨', 'success');
    showLog('① 엑셀 업로드 → ② 통합 또는 개별지도 시작 버튼', 'info');

    const urlParams = new URLSearchParams(window.location.search);
    const runMode = urlParams.get('run');

    // Restoring building data from localStorage if available in main window mode
    if (!runMode) {
        try {
            const storedQueue = localStorage.getItem('buildingQueue');
            if (storedQueue) {
                buildingQueue = JSON.parse(storedQueue);
                buildingGroups = JSON.parse(localStorage.getItem('buildingGroups') || '{}');
                buildingUsages = JSON.parse(localStorage.getItem('buildingUsages') || '{}');
                totalCount = buildingQueue.length;
                
                const dz = document.getElementById('dropzone');
                if (dz) {
                    dz.classList.add('ok');
                    dz.querySelector('.dz-icon').textContent = '📊';
                    dz.querySelector('.dz-txt').textContent  = '이전 로드된 데이터';
                    dz.querySelector('.dz-sub').textContent  = `${totalCount}개 건물 복원됨`;
                }
                const fi = document.getElementById('fi');
                if (fi) {
                    fi.classList.add('show');
                    document.getElementById('fi-nm').textContent = '복원된 데이터';
                    document.getElementById('fi-ct').textContent = `${totalCount}개 건물 / 이전 세션에서 자동 복원됨`;
                }
                document.getElementById('btn-start-combined').disabled = false;
                document.getElementById('btn-start-individual').disabled = false;
                showLog(`이전 세션 데이터 복원 완료: 건물 ${totalCount}개`, 'success');
            }
        } catch(e) {
            showLog(`이전 데이터 복원 오류: ${e.message}`, 'warn');
        }
    }
    if (runMode) {
        // Hide sidebar to make the map full screen
        document.getElementById('sidebar').style.display = 'none';
        
        // Load settings and data from localStorage
        try {
            buildingQueue = JSON.parse(localStorage.getItem('buildingQueue') || '[]');
            buildingGroups = JSON.parse(localStorage.getItem('buildingGroups') || '{}');
            buildingUsages = JSON.parse(localStorage.getItem('buildingUsages') || '{}');
            offsetX = parseFloat(localStorage.getItem('mapOffsetX') || '0');
            offsetY = parseFloat(localStorage.getItem('mapOffsetY') || '14');
            strokeWeight = parseInt(localStorage.getItem('mapStrokeWeight') || '4');
            individualZoom = parseInt(localStorage.getItem('mapIndividualZoom') || '19');
            
            document.getElementById('off-x').value = offsetX;
            document.getElementById('off-y').value = offsetY;
            document.getElementById('stroke-weight').value = strokeWeight;
            
            totalCount = buildingQueue.length;
            doneCount = 0;
            failCount = 0;
            const startIdx = parseInt(urlParams.get('startIdx') || '0') || 0;
            curIdx = startIdx;
            
            showLog(`전체화면 모드 시작: ${runMode} (${totalCount}개 건물)`, 'success');
        } catch(e) {
            alert('설정 데이터 로딩 실패: ' + e.message);
            window.close();
            return;
        }
    }

    // Auto init API
    setTimeout(() => {
        autoInitAPI().then(() => {
            if (runMode) {
                // Wait briefly for full screen rendering and check permissions/run
                setTimeout(() => {
                    checkPermissionAndRun(runMode);
                }, 1200);
            }
        });
    }, 300);
})();
</script>
</body>
</html>
